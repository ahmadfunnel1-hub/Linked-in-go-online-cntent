<!-- ==========================================================================
     GO ONLINE — Floating Sticky WhatsApp Button + Glowing Label
     زر واتساب عائم مع فقاعة نص + تأثير Glow

     سلوك الفقاعة:
       - مخفية أول ما تفتح الصفحة (عشان ما تغطي على الهيدلاين)
       - بتطلع لما الزائر ينزل 40% من الصفحة، أو بعد ١٢ ثانية (أيهما أول)
       - بتختفي لحالها بعد ٩ ثواني، والدائرة بتضل
       - أو الزائر بسكّرها بالـ × وبتضل مسكّرة لباقي الجلسة

     تعديل سريع:
       1) الرقم       → href تبع #sticky-whatsapp-btn (الفقاعة بتاخده تلقائياً)
       2) نص الفقاعة  → النص داخل <a class="wa-bubble-text">
       3) التوقيت     → WA_SHOW_AT و WA_FALLBACK_MS و WA_AUTO_HIDE_MS
       4) الألوان     → --wa-green و --wa-bubble-bg و --wa-bubble-fg

     مكان اللزق في GHL:
       Funnel → Settings → Custom Code → Footer Tracking Code
     ========================================================================== -->

<div id="sticky-whatsapp-wrap" class="wa-bubble-off">

  <!-- الفقاعة: النص اللي فوق الزر -->
  <div class="wa-bubble">

    <a
      class="wa-bubble-text"
      href="https://wa.me/971527223889"
      target="_blank"
      rel="noopener noreferrer"
    >عندك مشكلة بالدفع؟ احكي معنا</a>

    <!-- زر الإغلاق — بيخفي الفقاعة وبتضل الدائرة -->
    <button type="button" class="wa-bubble-close" aria-label="إخفاء الرسالة">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          d="M6.5 6.5l11 11M17.5 6.5l-11 11"
        />
      </svg>
    </button>

  </div>

  <!-- الزر: الدائرة الخضراء + أيقونة واتساب -->
  <a
    id="sticky-whatsapp-btn"
    href="https://wa.me/971527223889"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="تواصل معنا على الواتساب"
  >
    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path
        fill="currentColor"
        d="M16.04 2.003c-7.73 0-14.01 6.28-14.01 14.01 0 2.47.64 4.88 1.86 7L1.91 30.2l7.35-1.93a13.96 13.96 0 0 0 6.77 1.72h.01c7.73 0 14.01-6.28 14.01-14.01 0-3.74-1.46-7.26-4.1-9.91a13.91 13.91 0 0 0-9.91-4.07zm0 25.62h-.01a11.6 11.6 0 0 1-5.91-1.62l-.42-.25-4.36 1.14 1.16-4.25-.27-.44a11.6 11.6 0 1 1 9.81 5.42zm6.36-8.69c-.35-.17-2.06-1.02-2.38-1.13-.32-.12-.55-.17-.78.17-.23.35-.9 1.13-1.1 1.36-.2.23-.41.26-.75.09-.35-.17-1.47-.54-2.8-1.73a10.48 10.48 0 0 1-1.94-2.41c-.2-.35-.02-.54.15-.71.16-.16.35-.41.52-.61.17-.2.23-.35.35-.58.12-.23.06-.44-.03-.61-.09-.17-.78-1.88-1.07-2.58-.28-.68-.57-.59-.78-.6h-.67c-.23 0-.61.09-.93.44-.32.35-1.22 1.19-1.22 2.9 0 1.71 1.25 3.36 1.42 3.59.17.23 2.45 3.74 5.94 5.25.83.36 1.48.57 1.98.73.83.26 1.59.23 2.19.14.67-.1 2.06-.84 2.35-1.65.29-.81.29-1.51.2-1.65-.08-.15-.31-.23-.66-.4z"
      />
    </svg>
  </a>

</div>


<style>

  /* =========================================================
     1) المتغيرات — كل التعديلات من هنا
     ========================================================= */

  #sticky-whatsapp-wrap {
    --wa-green: #25D366;      /* لون الزر */
    --wa-glow: 37, 211, 102;  /* نفس اللون بصيغة RGB — للـ glow */

    /* الفقاعة غامقة شفافة — بتندمج مع الصفحات الغامقة.
       بدك فقاعة بيضا؟ بدّل السطرين لـ:
       --wa-bubble-bg: rgba(255, 255, 255, 0.96);
       --wa-bubble-fg: #0b3d24;                    */
    --wa-bubble-bg: rgba(12, 22, 17, 0.95);
    --wa-bubble-fg: #eafff3;

    --wa-size: 68px;          /* قياس الدائرة */
    --wa-icon: 38px;          /* قياس الأيقونة */
    --wa-right: 28px;         /* البعد عن يمين الشاشة */
    --wa-bottom: 28px;        /* البعد عن أسفل الشاشة */
    --wa-tail: 24px;          /* مكان "ذيل" الفقاعة (يصير فوق مركز الزر) */

    position: fixed !important;
    right: var(--wa-right) !important;
    bottom: var(--wa-bottom) !important;

    /* حجم الحاوية = حجم الدائرة. الفقاعة بتطلع فوقها بالـ absolute */
    width: var(--wa-size) !important;
    height: var(--wa-size) !important;

    z-index: 2147483647 !important;   /* فوق كل عناصر GHL */
  }


  /* =========================================================
     2) الدائرة الخضراء + الـ GLOW
     ========================================================= */

  #sticky-whatsapp-btn {
    position: relative !important;

    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    width: 100% !important;
    height: 100% !important;

    border-radius: 50% !important;
    background-color: var(--wa-green) !important;
    color: #ffffff !important;

    text-decoration: none !important;
    border: none !important;
    -webkit-tap-highlight-color: transparent;

    box-shadow:
      0 6px 20px rgba(0, 0, 0, 0.30),
      0 0 16px 3px rgba(var(--wa-glow), 0.40) !important;

    animation: wa-glow 2.6s ease-in-out infinite;
    transition: transform 0.2s ease;
  }

  /* حلقة نابضة حوالين الزر — تزيد إحساس الـ glow */
  #sticky-whatsapp-btn::after {
    content: "";
    position: absolute;
    inset: 0;

    border-radius: 50%;
    border: 2px solid rgba(var(--wa-glow), 0.55);

    animation: wa-ripple 2.6s ease-out infinite;
    pointer-events: none;
  }

  #sticky-whatsapp-btn svg {
    position: relative;
    z-index: 1;

    width: var(--wa-icon) !important;
    height: var(--wa-icon) !important;
    display: block !important;
  }

  #sticky-whatsapp-btn:hover {
    transform: scale(1.08);
  }


  /* =========================================================
     3) الفقاعة (النص فوق الزر)
     ========================================================= */

  /* الغلاف: المكان + القياس + حركة الدخول والخروج */
  #sticky-whatsapp-wrap .wa-bubble {
    position: absolute !important;
    right: 0 !important;
    bottom: calc(100% + 13px) !important;

    /* سطر واحد إذا بيكفي، وإلا ينزل لسطرين لحاله */
    width: max-content;
    max-width: min(300px, calc(100vw - 56px));

    opacity: 1;
    transform: translateY(0) scale(1);

    transition:
      opacity 0.40s ease,
      transform 0.45s cubic-bezier(0.2, 0.8, 0.25, 1);
  }

  /* الحالة المخفية — قبل ما ينزل، أو بعد ما تختفي/تنسكر */
  #sticky-whatsapp-wrap.wa-bubble-off .wa-bubble {
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px) scale(0.96);
    pointer-events: none;

    transition:
      opacity 0.28s ease,
      transform 0.28s ease,
      visibility 0s linear 0.28s;
  }

  /* الفقاعة نفسها: الشكل + الـ glow (وهي رابط كمان) */
  #sticky-whatsapp-wrap .wa-bubble-text {
    position: relative;
    display: block !important;

    padding: 10px 14px !important;
    border-radius: 14px !important;

    background: var(--wa-bubble-bg) !important;
    border: 1px solid rgba(var(--wa-glow), 0.55) !important;

    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);

    direction: rtl;
    text-align: center;
    text-decoration: none !important;
    font-family: inherit !important;
    font-size: 14px !important;
    font-weight: 700 !important;
    line-height: 1.55 !important;

    box-shadow:
      0 10px 24px rgba(0, 0, 0, 0.28),
      0 0 12px 2px rgba(var(--wa-glow), 0.25) !important;

    animation: wa-bubble-glow 2.8s ease-in-out infinite;
    transition: transform 0.2s ease;
  }

  /* اللون بقاعدة لحاله وعلى كل الأبناء — بعض ثيمات GHL بتفرض لون
     على كل الروابط، وهاي بتضمن إنه النص يضل باين */
  #sticky-whatsapp-wrap .wa-bubble-text,
  #sticky-whatsapp-wrap .wa-bubble-text * {
    color: var(--wa-bubble-fg) !important;
    -webkit-text-fill-color: var(--wa-bubble-fg) !important;
    opacity: 1 !important;
    visibility: visible !important;
    text-indent: 0 !important;
    font-size: inherit !important;
  }

  #sticky-whatsapp-wrap .wa-bubble-text:hover {
    transform: translateY(-3px);
  }

  /* ذيل الفقاعة — مثلث صغير يأشّر على الزر */
  #sticky-whatsapp-wrap .wa-bubble-text::after {
    content: "";
    position: absolute;
    top: 100%;
    right: var(--wa-tail);

    width: 12px;
    height: 12px;

    background: var(--wa-bubble-bg);
    border-right: 1px solid rgba(var(--wa-glow), 0.55);
    border-bottom: 1px solid rgba(var(--wa-glow), 0.55);
    border-bottom-right-radius: 3px;

    transform: translateY(-6px) rotate(45deg);
  }


  /* =========================================================
     4) زر إغلاق الفقاعة (×)
     ========================================================= */

  #sticky-whatsapp-wrap .wa-bubble-close {
    position: absolute !important;
    top: -9px !important;
    left: -9px !important;

    display: flex !important;
    align-items: center !important;
    justify-content: center !important;

    width: 22px !important;
    height: 22px !important;
    min-width: 0 !important;
    min-height: 0 !important;
    padding: 0 !important;
    margin: 0 !important;

    border-radius: 50% !important;
    border: 1px solid rgba(255, 255, 255, 0.22) !important;
    background: #16231c !important;
    color: #b9c7c0 !important;

    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35) !important;
    cursor: pointer !important;
    -webkit-appearance: none !important;
    appearance: none !important;
    -webkit-tap-highlight-color: transparent;

    transition: transform 0.15s ease, color 0.15s ease, background 0.15s ease;
  }

  #sticky-whatsapp-wrap .wa-bubble-close svg {
    width: 12px !important;
    height: 12px !important;
    display: block !important;
  }

  #sticky-whatsapp-wrap .wa-bubble-close:hover {
    background: #223229 !important;
    color: #ffffff !important;
    transform: scale(1.12);
  }


  /* =========================================================
     5) الحركات (Keyframes)
     ========================================================= */

  @keyframes wa-glow {
    0%, 100% {
      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.30),
        0 0 14px 3px rgba(var(--wa-glow), 0.38);
    }
    50% {
      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.30),
        0 0 30px 8px rgba(var(--wa-glow), 0.70);
    }
  }

  @keyframes wa-ripple {
    0%   { transform: scale(1);    opacity: 0.65; }
    70%  { transform: scale(1.45); opacity: 0; }
    100% { transform: scale(1.45); opacity: 0; }
  }

  @keyframes wa-bubble-glow {
    0%, 100% {
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.28),
        0 0 12px 2px rgba(var(--wa-glow), 0.25);
    }
    50% {
      box-shadow:
        0 10px 24px rgba(0, 0, 0, 0.28),
        0 0 22px 5px rgba(var(--wa-glow), 0.50);
    }
  }


  /* =========================================================
     6) الموبايل
     ========================================================= */

  @media (max-width: 767px) {

    #sticky-whatsapp-wrap {
      --wa-size: 58px;
      --wa-icon: 33px;
      --wa-right: 18px;
      --wa-bottom: 20px;
      --wa-tail: 20px;
    }

    #sticky-whatsapp-wrap .wa-bubble {
      max-width: min(230px, calc(100vw - 40px));
    }

    #sticky-whatsapp-wrap .wa-bubble-text {
      font-size: 13px !important;
      padding: 9px 12px !important;
    }

    /* مساحة ضغط أكبر للـ × على اللمس */
    #sticky-whatsapp-wrap .wa-bubble-close {
      width: 24px !important;
      height: 24px !important;
    }

  }


  /* =========================================================
     7) احترام إعداد "تقليل الحركة" عند المستخدم
     ========================================================= */

  @media (prefers-reduced-motion: reduce) {

    #sticky-whatsapp-btn,
    #sticky-whatsapp-btn::after,
    #sticky-whatsapp-wrap .wa-bubble-text {
      animation: none !important;
    }

    #sticky-whatsapp-btn::after {
      opacity: 0 !important;
    }

    #sticky-whatsapp-wrap .wa-bubble,
    #sticky-whatsapp-wrap.wa-bubble-off .wa-bubble {
      transition: none !important;
    }

  }

</style>


<script>

  (function () {

    /* ------- إعدادات التوقيت ------- */

    /* الفقاعة بتطلع لما الزائر ينزل هالنسبة من الصفحة (0.5 = نص الصفحة) */
    var WA_SHOW_AT = 0.4;

    /* شبكة أمان: بتطلع بعد هالمدة حتى لو ما سكرل أبداً
       (صفحة قصيرة، أو صفحة بتسكرل بطريقة غريبة). 0 = بدون شبكة أمان */
    var WA_FALLBACK_MS = 12000;

    /* بعد كم ميلي ثانية تختفي لحالها (0 = تضل ظاهرة) */
    var WA_AUTO_HIDE_MS = 9000;

    /* خلّيه true بتطبع بالـ Console شو صاير — للتشخيص */
    var WA_DEBUG = false;

    /* --------------------------------- */

    var CLOSED_KEY = "goOnline_waBubble_v2";

    function log() {
      if (!WA_DEBUG || !window.console) return;
      console.log.apply(console, ["[wa]"].concat([].slice.call(arguments)));
    }

    function isBubbleClosed() {
      try {
        return sessionStorage.getItem(CLOSED_KEY) === "1";
      } catch (e) {
        /* التصفح الخاص أو تخزين مقفول — منكمّل عادي */
        return false;
      }
    }

    function rememberBubbleClosed() {
      try {
        sessionStorage.setItem(CLOSED_KEY, "1");
      } catch (e) {}
    }

    /* كم نزل الزائر — منجيب القيمة من كل المصادر الممكنة، لأن بعض
       القوالب بتسكرل على <html> وبعضها على <body> */
    function scrolledRatio() {
      var doc = document.documentElement;
      var body = document.body || {};

      var pageHeight = Math.max(
        doc.scrollHeight || 0, body.scrollHeight || 0,
        doc.offsetHeight || 0, body.offsetHeight || 0
      );

      var scrollable = pageHeight - window.innerHeight;
      if (scrollable <= 40) return -1;   /* صفحة ما فيها سكرول */

      var y = Math.max(
        window.pageYOffset || 0,
        doc.scrollTop || 0,
        body.scrollTop || 0
      );

      return y / scrollable;
    }

    function setupWhatsApp() {

      var wraps = document.querySelectorAll("#sticky-whatsapp-wrap");

      if (!wraps.length) return;

      /* لو الكود مركّب مرتين بالغلط — نخلي نسخة واحدة */
      for (var i = 1; i < wraps.length; i++) {
        wraps[i].parentNode && wraps[i].parentNode.removeChild(wraps[i]);
      }

      var wrap = wraps[0];

      /* ننقل الزر تحت <body> مباشرة، لأن sections/rows في GHL
         بتكسر الـ fixed positioning (transform على الأب). */
      if (wrap.parentNode !== document.body) {
        document.body.appendChild(wrap);
      }

      /* منركّب المستمعين مرة وحدة بس */
      if (wrap.getAttribute("data-wa-ready") === "1") return;
      wrap.setAttribute("data-wa-ready", "1");

      var button = wrap.querySelector("#sticky-whatsapp-btn");
      var bubbleLink = wrap.querySelector(".wa-bubble-text");
      var closeButton = wrap.querySelector(".wa-bubble-close");

      /* الفقاعة بتاخد نفس رقم الزر — عشان الرقم ينعدّل بمكان واحد */
      if (button && bubbleLink) {
        bubbleLink.setAttribute("href", button.getAttribute("href"));
      }

      var hideTimer = null;
      var fallbackTimer = null;
      var pollTimer = null;
      var lastCheck = 0;
      var shown = false;
      var done = false;   /* خلصت قصة الفقاعة — ما بترجع تطلع */

      function stopWatching() {
        window.removeEventListener("scroll", onScroll, true);
        document.removeEventListener("scroll", onScroll, true);
        clearInterval(pollTimer);
        clearTimeout(fallbackTimer);
      }

      function hideBubble() {
        wrap.classList.add("wa-bubble-off");
      }

      function finish() {
        done = true;
        stopWatching();
        clearTimeout(hideTimer);
      }

      function showBubble(why) {
        if (done || shown) return;
        shown = true;

        log("طلعت الفقاعة —", why);
        wrap.classList.remove("wa-bubble-off");
        stopWatching();

        if (WA_AUTO_HIDE_MS > 0) {
          hideTimer = setTimeout(function () {
            hideBubble();
            finish();
          }, WA_AUTO_HIDE_MS);
        }
      }

      function checkScroll() {
        var ratio = scrolledRatio();
        if (ratio >= WA_SHOW_AT) showBubble("سكرول " + ratio.toFixed(2));
      }

      /* throttle زمني بسيط — بدون requestAnimationFrame.
         الـ rAF ممكن ينخنق (تبويب بالخلفية مثلاً) وتعلق الفقاعة
         بدون ما تطلع أبداً. */
      function onScroll() {
        if (done || shown) return;

        var now = new Date().getTime();
        if (now - lastCheck < 150) return;
        lastCheck = now;

        checkScroll();
      }

      /* لو سكّرها قبل بنفس الجلسة — ما بنعرضها أبداً */
      if (isBubbleClosed()) {
        log("الزائر سكّرها قبل — ما رح تطلع");
        finish();
      } else {

        /* منسمع على window و document بالـ capture، لأن بعض قوالب GHL
           بتخلي السكرول على عنصر داخلي والحدث ما بوصل للـ window */
        window.addEventListener("scroll", onScroll, true);
        document.addEventListener("scroll", onScroll, true);

        /* وكمان منفحص كل ٤٠٠ ميلي — بتشتغل حتى لو ما وصلنا ولا حدث سكرول */
        pollTimer = setInterval(checkScroll, 400);

        /* شبكة أمان: تطلع بعد المدة حتى لو ما سكرل أبداً */
        if (WA_FALLBACK_MS > 0) {
          fallbackTimer = setTimeout(function () {
            showBubble("انتهى وقت شبكة الأمان");
          }, WA_FALLBACK_MS);
        }

        /* لو فتح الصفحة وهو نازل أصلاً (رجوع للخلف مثلاً) */
        checkScroll();
      }

      if (closeButton) {
        closeButton.addEventListener("click", function (event) {
          event.preventDefault();
          hideBubble();
          rememberBubbleClosed();
          finish();
        });
      }

    }

    /* GHL يحقن الكود بعد ما يخلص DOMContentLoaded بأحيان كثيرة،
       فمنشيّك على الحالة بدل ما نعتمد على الـ event لحاله. */

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", setupWhatsApp);
    } else {
      setupWhatsApp();
    }

    /* شيكة أخيرة بعد ما تخلص الصفحة تتحمّل (لو GHL أعاد بناء السكشن) */
    window.addEventListener("load", setupWhatsApp);

  })();

</script>
