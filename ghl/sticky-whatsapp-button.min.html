<script>
(function(){
var WA_SHOW_AT=0.4,WA_FALLBACK_MS=12000,WA_AUTO_HIDE_MS=9000,WA_DEBUG=false;
var KEY="goOnline_waBubble_v2";
function log(){if(WA_DEBUG&&window.console)console.log.apply(console,["[wa]"].concat([].slice.call(arguments)));}
function closed(){try{return sessionStorage.getItem(KEY)==="1";}catch(e){return false;}}
function remember(){try{sessionStorage.setItem(KEY,"1");}catch(e){}}
function ratio(){
var d=document.documentElement,b=document.body||{};
var h=Math.max(d.scrollHeight||0,b.scrollHeight||0,d.offsetHeight||0,b.offsetHeight||0);
var s=h-window.innerHeight;
if(s<=40)return -1;
return Math.max(window.pageYOffset||0,d.scrollTop||0,b.scrollTop||0)/s;
}
function setup(){
var all=document.querySelectorAll("#sticky-whatsapp-wrap");
if(!all.length)return;
for(var i=1;i<all.length;i++){if(all[i].parentNode)all[i].parentNode.removeChild(all[i]);}
var wrap=all[0];
if(wrap.parentNode!==document.body)document.body.appendChild(wrap);
if(wrap.getAttribute("data-wa-ready")==="1")return;
wrap.setAttribute("data-wa-ready","1");
log("ركّبت الزر");
var btn=wrap.querySelector("#sticky-whatsapp-btn");
var link=wrap.querySelector(".wa-bubble-text");
var x=wrap.querySelector(".wa-bubble-close");
if(btn&&link)link.setAttribute("href",btn.getAttribute("href"));
var hideT=null,fallT=null,poll=null,last=0,shown=false,done=false;
function stop(){
window.removeEventListener("scroll",onScroll,true);
document.removeEventListener("scroll",onScroll,true);
clearInterval(poll);clearTimeout(fallT);
}
function hide(){wrap.className="wa-bubble-off";}
function finish(){done=true;stop();clearTimeout(hideT);}
function show(why){
if(done||shown)return;
shown=true;log("طلعت الفقاعة",why);
wrap.className="";stop();
if(WA_AUTO_HIDE_MS>0)hideT=setTimeout(function(){hide();finish();},WA_AUTO_HIDE_MS);
}
function check(){var r=ratio();if(r>=WA_SHOW_AT)show("scroll "+r.toFixed(2));}
function onScroll(){
if(done||shown)return;
var n=new Date().getTime();
if(n-last<150)return;
last=n;check();
}
if(closed()){log("مسكّرة من قبل");finish();}
else{
window.addEventListener("scroll",onScroll,true);
document.addEventListener("scroll",onScroll,true);
poll=setInterval(check,400);
if(WA_FALLBACK_MS>0)fallT=setTimeout(function(){show("fallback");},WA_FALLBACK_MS);
check();
}
if(x)x.addEventListener("click",function(e){e.preventDefault();hide();remember();finish();});
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",setup);
else setup();
window.addEventListener("load",setup);
})();
</script>
