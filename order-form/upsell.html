<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تغير وارتُق | عرض خاص</title>
<!--
  زر الـ Upsell — الصقه داخل عنصر Custom JS/HTML في صفحة الـ Upsell على GHL.
  يقرأ إيميل العميل المحفوظ من نموذج الحجز (لازم الصفحتين على نفس الدومين)
  ويفتح رابط Stripe للـ Upsell والإيميل معبّأ، فيقدر Stripe Link يقترح بطاقته المحفوظة.
  الإعدادات في CONFIG أسفل الملف.
-->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  .tw-upsell { direction: rtl; text-align: center; max-width: 440px; margin: 0 auto; padding: 16px; }
  .tw-upsell, .tw-upsell * { box-sizing: border-box; margin: 0; font-family: "Tajawal", system-ui, sans-serif; }
  .tw-upsell .tw-cta {
    display: block; width: 100%; border: 0; cursor: pointer; border-radius: 14px; padding: 16px;
    font-size: 20px; font-weight: 800; line-height: 1.3; color: #1a1a1a;
    background: linear-gradient(180deg, #f2c25c, #e0a93a);
    box-shadow: 0 6px 16px rgba(224,169,58,.35), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .tw-upsell .tw-cta[disabled] { opacity: .7; cursor: wait; }
  .tw-upsell .tw-decline { display: inline-block; margin-top: 14px; color: #6b6b6b; font-size: 14px; text-decoration: underline; }
</style>

<div class="tw-upsell">
  <button class="tw-cta" type="button" data-tw-upsell>نعم، أضف العرض لحجزي</button>
  <a class="tw-decline" href="#" data-tw-decline>لا شكراً، أكمل بدون العرض</a>
</div>

<script>
(function () {
  /* =====================================================================
   * upsellLink:  رابط Stripe Payment Link للـ Upsell
   * declineUrl:  رابط صفحة الشكر لمن يرفض العرض
   * ===================================================================== */
  var CONFIG = {
    upsellLink: "https://buy.stripe.com/REPLACE_UPSELL",
    declineUrl: "https://REPLACE_THANK_YOU_PAGE"
  };

  if (window.__twUpsellBound) return;
  window.__twUpsellBound = true;

  function nav(url) {
    try { window.top.location.href = url; } catch (_) { window.location.href = url; }
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t.closest) return;

    if (t.closest("[data-tw-decline]")) {
      e.preventDefault();
      nav(CONFIG.declineUrl);
      return;
    }

    var btn = t.closest("[data-tw-upsell]");
    if (!btn) return;
    if (CONFIG.upsellLink.indexOf("REPLACE_") !== -1) {
      alert("رابط الـ Upsell غير مُعدّ بعد — أضفه في CONFIG.upsellLink.");
      return;
    }

    var lead = null;
    try { lead = JSON.parse(localStorage.getItem("tw_lead") || "null"); } catch (_) {}

    var url = new URL(CONFIG.upsellLink);
    if (lead && lead.email) url.searchParams.set("prefilled_email", lead.email);
    if (lead && lead.phone) url.searchParams.set("client_reference_id", "upsell_" + String(lead.phone).replace("+", ""));

    btn.disabled = true;
    btn.textContent = "جاري التحويل...";
    nav(url.toString());
  });

  window.addEventListener("pageshow", function () {
    document.querySelectorAll(".tw-upsell [data-tw-upsell]").forEach(function (b) {
      b.disabled = false;
      b.textContent = "نعم، أضف العرض لحجزي";
    });
  });
})();
</script>
